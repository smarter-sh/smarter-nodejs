---
#------------------------------------------------------------------------------
# Type-check, lint and run the unit tests on every supported Node.js version.
#
# The unit tests never reach a Smarter platform: a fetch double answers every
# request. The live tests (test/live/) are skipped, because SMARTER_TEST_LIVE
# is not set.
#
# Runs on every pull request, and as the first job of pushMain.yml, which runs
# on every push to main, alpha and beta, and releases only if this passes.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint --max-warnings=0 . && npx prettier --check .

      - name: Run the unit tests, with coverage
        run: npx vitest run --coverage

      # one upload is enough: the coverage is the same on every Node.js version.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: nodejs
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
