---
#---------------------------------------------------------
# Release: on every push to main (a release) or alpha or beta (a prerelease),
# as smarter-python's release.yml does for PyPI.
#
#   test               the whole of test.yml (type-check, lint, unit tests)
#   build              the whole of build.yml (build dist/, check the package)
#   semantic-release   version, CHANGELOG.md, tag, GitHub release. See
#                      release.config.js. Runs only if test and build passed.
#   publish            build the new tag and publish it to npm, with the
#                      latest dist-tag from main, and alpha or beta from those
#                      branches, so that `npm install @smarter.sh/api` never
#                      gets a prerelease
#   merge-main         after a release on main, merge main into alpha
#
# A push whose commits since the last tag are all docs, test, style or refactor
# releases nothing, and publishes nothing. semantic-release's own commit ends
# in [skip ci], so it doesn't start another run.
#
# Publishing uses npm's trusted publishing (OIDC), as the platform's
# uiChatRelease.yml does: no npm token is stored in the repository, and every
# version gets a provenance statement. Configure it on npmjs.com:
# @smarter.sh/api → Settings → Trusted publisher → GitHub Actions, repository
# smarter-sh/smarter-nodejs, workflow pushMain.yml, environment npm. If the
# publish job fails after a release, fix the cause and use "Re-run failed
# jobs": it publishes the same tag again.
#
# Requires a PAT secret: a GitHub personal access token that
# may push to this repository's protected branches.
#---------------------------------------------------------
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - beta

permissions:
  contents: read

# one release at a time per branch. A push while a release runs waits for it,
# and the next run releases everything since the last tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    uses: ./.github/workflows/build.yml

  semantic-release:
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      NODE_ENV: test
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Semantic Release
        id: semantic
        # A release commits CHANGELOG.md and the version (@semantic-release/git), so HEAD moves.
        run: |
          before=$(git rev-parse HEAD)
          npx semantic-release
          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

  publish:
    name: Publish to npm
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@smarter.sh/api/v/${{ needs.semantic-release.outputs.version }}
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      # the release's tag, which carries the version in package.json and src/version.ts.
      - name: Checkout the release's tag
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      # 1.2.3 is published as latest, and 1.2.3-alpha.4 and 1.2.3-beta.5 as alpha and beta.
      - name: Dist-tag
        id: dist_tag
        shell: bash
        run: |
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            dist_tag=latest
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          else
            echo "::error::$VERSION is not a release (1.2.3) or an alpha or beta prerelease (1.2.3-alpha.4)"
            exit 1
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, dist-tag $dist_tag"

      - name: Build and check the package
        run: |
          npm run build
          npm pack --dry-run && npx publint

      # the built package must report the release's version.
      - name: Import the built package, and check its version
        run: |
          node --input-type=module -e 'import { VERSION } from "./dist/index.js"; if (VERSION !== process.env.VERSION) { console.error(`dist/ is ${VERSION}, not ${process.env.VERSION}`); process.exit(1); }'
          node -e 'const { Smarter } = require("./dist/index.js"); console.log(typeof Smarter)'

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      # --ignore-scripts: prepublishOnly would build dist/ again. Publish the
      # dist/ that was just checked instead.
      - name: Publish to npm
        run: npm publish --ignore-scripts --access public --provenance --tag "${{ steps.dist_tag.outputs.dist_tag }}"

      - name: Summary
        run: |
          {
            echo "### Published @smarter.sh/api@$VERSION"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@smarter.sh/api/v/$VERSION (dist-tag ${{ steps.dist_tag.outputs.dist_tag }})"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-main:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{ secrets.PAT }}

      - name: Merge main into alpha
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: alpha
