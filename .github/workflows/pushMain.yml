---
#---------------------------------------------------------
# The same procedure as https://github.com/smarter-sh/smarter-chat's:
# - Create a semantic release. See release.config.js. A
#   push to alpha or beta creates a prerelease.
# - After a release on main, merge main into alpha.
#
# semantic-release does not publish to npm: publish a
# release on main with `make release`.
#
# Requires a PAT secret: a GitHub personal access token that
# may push to this repository's protected branches.
#---------------------------------------------------------
name: Push to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - beta
jobs:
  semantic-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      NODE_ENV: test
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Semantic Release
        id: semantic
        # A release commits CHANGELOG.md and the version (@semantic-release/git), so HEAD moves.
        run: |
          before=$(git rev-parse HEAD)
          npx semantic-release
          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

  merge-main:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.PAT }}

      - name: Merge main into alpha
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: alpha
